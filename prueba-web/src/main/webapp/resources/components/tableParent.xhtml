<?xml version="1.0" encoding="UTF-8"?>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:composite="jakarta.faces.composite"
      xmlns:component="jakarta.faces.composite/components"
>

<composite:interface>
    <composite:attribute name="value" required="true"/>
</composite:interface>
<composite:implementation>
    <h:outputStylesheet library="styles" name="main.css"/>
    <h:form id="tableForm">
        <p:dataTable id="tableParent" value="#{cc.attrs.value}" var="parent"
                     lazy="true"
                     rowKey="#{parent.code}"
                     rows="10"
                     paginator="true" paginatorPosition="both"
                     paginatorTemplate="{CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}"
                     currentPageReportTemplate="{startRecord}-{endRecord} of {totalRecords} records"
                     rowsPerPageTemplate="5,10,20"
        >
            <f:facet name="header" >
                <div class="header-parentTable">
                    Parent Jakarta
                    <p:commandButton value="Agregar" type="button" icon="pi pi-plus" onclick="PF('formDialog').show()"/>
                </div>
            </f:facet>
            <p:column style="width:2rem" ariaHeaderText="Row Toggler">
                <p:rowToggler rendered="#{not empty parent.parentDetails}"/>
            </p:column>
            <p:column headerText="Código">
                <h:outputText value="#{parent.code}"/>
            </p:column>
            <p:column headerText="Nombre">
                <h:outputText value="#{parent.name}"/>
            </p:column>

            <p:column headerText="Estado">
                <p:badge rendered="#{parent.status == 'APROBADO'}" severity="success" value="#{parent.status}"
                         styleClass="mr-2"/>
                <p:badge rendered="#{parent.status == 'PENDIENTE'}" severity="danger" value="#{parent.status}"
                         styleClass="mr-2"/>

            </p:column>
            <p:column headerText="Fecha creación">
                <h:outputText value="#{parent.createdAt}"/>
            </p:column>

            <p:column headerText="Acciones" class="bottom-container">
                <p:button value="Editar" styleClass="ui-button-outlined ui-button-info"/>
                <p:button value="Eliminar" styleClass="ui-button-outlined ui-button-danger"/>
            </p:column>

            <p:rowExpansion>
                <component:tableParentDetail value="#{parent.parentDetails}"/>
            </p:rowExpansion>

        </p:dataTable>
    </h:form>

    <component:formParent title="Creacion parent"/>
</composite:implementation>
</html>
