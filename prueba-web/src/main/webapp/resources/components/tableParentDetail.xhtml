<?xml version="1.0" encoding="UTF-8"?>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="jakarta.faces.core"
      xmlns:composite="jakarta.faces.composite">

<composite:interface>
    <composite:attribute name="value" required="true" />
</composite:interface>

<composite:implementation>

    <div class="parentDetail-table_style">

        <p:dataTable id="tableParentDetail" value="#{cc.attrs.value}" var="parentDetail">

            <p:column headerText="Nombre" styleClass="column-align">
                <h:outputText value="#{parentDetail.name}" />
            </p:column>
            <p:column headerText="Cantidad" styleClass="column-align">
                <h:outputText value="#{parentDetail.quantity}" />
            </p:column>
            <p:column headerText="Creacion" styleClass="column-align">
                <h:outputText value="#{parentDetail.createdAt}" />
            </p:column>
            <p:column headerText="Acciones" styleClass="bottom-container">
                <p:button value="Editar" styleClass="ui-button-outlined ui-button-info" />
                <p:button value="Eliminar" styleClass="ui-button-outlined ui-button-danger" />
            </p:column>


        </p:dataTable>
    </div>
</composite:implementation>
</html>
