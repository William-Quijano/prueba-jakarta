<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:h="jakarta.faces.html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:component="jakarta.faces.composite/components">

<h:head>
    <title>Prueba jakarta</title>

    <meta http-equiv="X-UA-Compatible" content="IE=edge"/>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/>
    <meta name="apple-mobile-web-app-capable" content="yes"/>

    <h:link rel="stylesheet" type="text/css" href="/resources/main.css"/>

</h:head>
<h:body>
    <ui:define name="title">Parent</ui:define>


    <!--  Ejecuta la inicializacion del controlador  -->
    <ui:define name="head">
        <f:metadata>
            <f:viewAction action="#{parentController.init()}"/>
        </f:metadata>
    </ui:define>
    <!--  Visualiza los mensajes  -->
    <p:growl id="growl" showDetail="true"/>

    <!--  Titutlo y boton para agregar  -->
    <div class="header-parent">
        <h1>Crud Jakarta</h1>

        <p:button
                value="Agregar"
                type="button"
                icon="pi pi-plus"
                onclick="PF('formDialogCreate').show();return false"
                styleClass="ui-button-outlined ui-button-text-icon-primary"
        />

    </div>

    <!--  Tabla principal  -->
    <component:tableParent value="#{parentController.parentList}"/>

    <!--    Dialog para los formularios-->
    <p:dialog header="Creacion parent" width="800" widgetVar="formDialogCreate" showEffect="fade"
              closeOnEscape="true">
        <component:formParent
                isUpdate="false"
                formAttrs="#{parentController.parentRequest}"
                submit="#{parentController.createParent()}"
        />
    </p:dialog>

    <p:dialog header="Actualizacion parent" width="800" widgetVar="formDialogUpdate" showEffect="fade"
              closeOnEscape="true">
        <component:formParent
                id="formUpdate"
                isUpdate="true"
                formAttrs="#{parentController.parentSelect}"
                submit="#{parentController.updateParent}"
        />
    </p:dialog>


    <p:confirmDialog widgetVar="deleteConfirmationDialog" header="Eliminar"
                     message="#{'¿Deseas eliminar este registro ?'}" global="true" showEffect="fade" hideEffect="fade"
                     responsive="true" width="350">
        <h:form>
            <p:commandButton value="Cancelar" type="button" styleClass="ui-button-outlined"/>
            <p:commandButton
                    value="Eliminar"
                    styleClass="ui-button-outlined ui-button-danger"
                    action="#{parentController.removeParent()}"
                    update="@([id$=tableForm])"
                    process="@this"
            />
        </h:form>
    </p:confirmDialog>


</h:body>
</html>
