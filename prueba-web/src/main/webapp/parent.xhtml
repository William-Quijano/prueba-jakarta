<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:h="jakarta.faces.html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:component="jakarta.faces.composite/components">

<h:head>
    <title>Prueba jakarta</title>

    <meta http-equiv="X-UA-Compatible" content="IE=edge"/>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/>
    <meta name="apple-mobile-web-app-capable" content="yes"/>

    <h:link rel="stylesheet" type="text/css" href="/resources/main.css"/>

</h:head>
<h:body>
    <ui:define name="title">Parent</ui:define>

    <ui:define name="head">

        <f:metadata>
            <f:viewAction action="#{parentController.init()}"/>
        </f:metadata>
    </ui:define>
    <p:growl id="growl" showDetail="true"/>
    <div class="header-parent">
        <h1>Crud Jakarta</h1>
        <h:form style="align-content: center">
            <p:commandButton
                    value="Agregar"
                    type="button"
                    icon="pi pi-plus"
                    onclick="PF('formDialogCreate').show()"
                    styleClass="ui-button-outlined ui-button-text-icon-primary"
            />
        </h:form>

    </div>
    <component:tableParent value="#{parentController.parentList}" />
    <p:dialog header="Creacion parent" width="800" widgetVar="formDialogCreate" showEffect="fade"
              closeOnEscape="true">
        <component:formParent
                isUpdate="false"
                formAttrs="#{parentController.parentRequest}"
                submit="#{parentController.createParent()}"
        />
    </p:dialog>

    <p:dialog header="Actualizacion parent" width="800" widgetVar="formDialogUpdate" showEffect="fade"
              closeOnEscape="true">
        <component:formParent
                id="formUpdate"
                isUpdate="true"
                formAttrs="#{parentController.parentSelect}"
                submit="#{parentController.updateParent}"
        />
    </p:dialog>


</h:body>
</html>
